sonar.organization=<fill-me>
sonar.projectKey=<fill-me>_lifelink
sonar.projectName=LifeLink

sonar.sources=gateway/src,services/donor-service/src,services/inventory-service/src,services/matching-service/src,services/notification-service/src,shared,frontend/src
sonar.tests=gateway/tests,services/donor-service/tests,services/inventory-service/tests,services/matching-service/tests,services/notification-service/tests
sonar.test.inclusions=**/tests/**/*.js
sonar.exclusions=db/migrations/**,**/node_modules/**,**/coverage/**,**/jest.config.js

# One lcov per workspace; paths inside are repo-relative and include shared/.
sonar.javascript.lcov.reportPaths=gateway/coverage/lcov.info,services/donor-service/coverage/lcov.info,services/inventory-service/coverage/lcov.info,services/matching-service/coverage/lcov.info,services/notification-service/coverage/lcov.info
# The React client has no unit tests (the spec targets service coverage); it is still analysed for issues.
sonar.coverage.exclusions=db/seed/**,**/*.test.js,frontend/src/**
