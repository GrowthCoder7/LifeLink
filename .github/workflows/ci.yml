name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lifelink
          POSTGRES_PASSWORD: lifelink
          POSTGRES_DB: lifelink
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lifelink -d lifelink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lifelink:lifelink@localhost:5432/lifelink
      DATABASE_URL_TEST: postgresql://lifelink:lifelink@localhost:5432/lifelink
      REDIS_URL: redis://localhost:6379
      REDIS_URL_TEST: redis://localhost:6379
      JWT_SECRET: test-jwt-secret
      PII_KEY: test-pii-key
      EXPIRY_INTERVAL_MS: "10000"
      ESCALATION_RETRY_MS: "15000"
      ESCALATION_ALERT_MIN: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/lcov.info"
          if-no-files-found: warn

  scan:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  package:
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: docker build -f db/Dockerfile .
      - run: docker build -f gateway/Dockerfile .
      - run: docker build -f services/donor-service/Dockerfile .
      - run: docker build -f services/inventory-service/Dockerfile .
      - run: docker build -f services/matching-service/Dockerfile .
      - run: docker build -f services/notification-service/Dockerfile .
      - run: docker build -f frontend/Dockerfile .
