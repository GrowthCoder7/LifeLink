# Separate project name so this can run alongside the main docker-compose.yml stack.
name: lifelink-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lifelink
      POSTGRES_PASSWORD: lifelink
      POSTGRES_DB: lifelink_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifelink -d lifelink_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
